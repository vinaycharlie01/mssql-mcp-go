<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="msRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cc2936"/>
      <stop offset="100%" style="stop-color:#e8475f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#cc2936;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#cc2936;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ADD8;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00ADD8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="200" cy="160" r="200" fill="url(#orb1)"/>
  <circle cx="1080" cy="480" r="180" fill="url(#orb2)"/>

  <!-- Grid -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#e04e5e" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#e04e5e" stroke-width="1"/>
  </g>

  <!-- Decorative waves -->
  <g filter="url(#softGlow)" opacity="0.1">
    <path d="M 0,320 Q 320,220 640,320 T 1280,320" stroke="#cc2936" stroke-width="2" fill="none"/>
    <path d="M 0,350 Q 320,450 640,350 T 1280,350" stroke="#00ADD8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- SQL Server Database Icon -->
  <g transform="translate(115, 140)" filter="url(#glow)">
    <ellipse cx="110" cy="35" rx="75" ry="30" fill="none" stroke="url(#msRed)" stroke-width="4.5" opacity="0.9"/>
    <line x1="35" y1="35" x2="35" y2="210" stroke="url(#msRed)" stroke-width="4.5" opacity="0.9"/>
    <line x1="185" y1="35" x2="185" y2="210" stroke="url(#msRed)" stroke-width="4.5" opacity="0.9"/>
    <ellipse cx="110" cy="210" rx="75" ry="30" fill="none" stroke="url(#msRed)" stroke-width="4.5" opacity="0.9"/>
    <path d="M 35,95 Q 110,125 185,95" fill="none" stroke="#cc2936" stroke-width="2.5" opacity="0.4"/>
    <path d="M 35,155 Q 110,185 185,155" fill="none" stroke="#cc2936" stroke-width="2.5" opacity="0.4"/>
    <line x1="60" y1="60" x2="160" y2="60" stroke="#e04e5e" stroke-width="2" opacity="0.25" stroke-dasharray="4,4"/>
    <line x1="60" y1="75" x2="130" y2="75" stroke="#e04e5e" stroke-width="2" opacity="0.18" stroke-dasharray="4,4"/>
    <g transform="translate(85, 110)" opacity="0.7">
      <path d="M 28,0 L 10,35 L 24,35 L 12,70 L 42,28 L 28,28 L 38,0 Z" fill="#e04e5e" opacity="0.6"/>
    </g>
    <g transform="translate(140, 185)" opacity="0.5">
      <rect x="0" y="10" width="20" height="15" rx="2.5" fill="none" stroke="#3fb950" stroke-width="2"/>
      <path d="M 4,10 L 4,6 Q 4,0 10,0 Q 16,0 16,6 L 16,10" fill="none" stroke="#3fb950" stroke-width="2"/>
    </g>
  </g>

  <!-- Main title -->
  <text x="640" y="265" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#e6edf3" text-anchor="middle" letter-spacing="-2">mssql-mcp-go</text>

  <!-- Subtitle -->
  <text x="640" y="325" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" fill="#8b949e" text-anchor="middle" font-weight="400" letter-spacing="1">Read-only SQL Server MCP Server for AI Assistants</text>

  <!-- Feature pills -->
  <g transform="translate(640, 380)">
    <rect x="-320" y="0" width="80" height="34" rx="17" fill="#00ADD8" opacity="0.15"/>
    <rect x="-320" y="0" width="80" height="34" rx="17" fill="none" stroke="#00ADD8" stroke-width="1.2" opacity="0.5"/>
    <text x="-280" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#00ADD8" text-anchor="middle" font-weight="600">Go 1.25</text>

    <rect x="-224" y="0" width="72" height="34" rx="17" fill="#58a6ff" opacity="0.15"/>
    <rect x="-224" y="0" width="72" height="34" rx="17" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
    <text x="-188" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="600">MCP</text>

    <rect x="-136" y="0" width="110" height="34" rx="17" fill="#a371f7" opacity="0.15"/>
    <rect x="-136" y="0" width="110" height="34" rx="17" fill="none" stroke="#a371f7" stroke-width="1.2" opacity="0.5"/>
    <text x="-81" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#a371f7" text-anchor="middle" font-weight="600">70+ Tools</text>

    <rect x="-10" y="0" width="108" height="34" rx="17" fill="#238636" opacity="0.15"/>
    <rect x="-10" y="0" width="108" height="34" rx="17" fill="none" stroke="#238636" stroke-width="1.2" opacity="0.5"/>
    <text x="44" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="600">Read-Only</text>

    <rect x="114" y="0" width="110" height="34" rx="17" fill="#d29922" opacity="0.15"/>
    <rect x="114" y="0" width="110" height="34" rx="17" fill="none" stroke="#d29922" stroke-width="1.2" opacity="0.5"/>
    <text x="169" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#d29922" text-anchor="middle" font-weight="600">Homebrew</text>

    <rect x="240" y="0" width="86" height="34" rx="17" fill="#2496ed" opacity="0.15"/>
    <rect x="240" y="0" width="86" height="34" rx="17" fill="none" stroke="#2496ed" stroke-width="1.2" opacity="0.5"/>
    <text x="283" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#2496ed" text-anchor="middle" font-weight="600">Docker</text>
  </g>

  <!-- Tagline -->
  <text x="640" y="475" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#484f58" text-anchor="middle" letter-spacing="3" font-weight="300">SCHEMA DISCOVERY  ·  DATA PROFILING  ·  QUERY ANALYSIS  ·  MIGRATION PLANNING</text>

  <!-- Corner accents -->
  <path d="M 0,0 L 100,0 L 0,100 Z" fill="#cc2936" opacity="0.05"/>
  <path d="M 1280,640 L 1180,640 L 1280,540 Z" fill="#00ADD8" opacity="0.05"/>

  <!-- Bottom accent -->
  <rect x="0" y="632" width="1280" height="8" fill="url(#msRed)" opacity="0.6"/>
</svg>