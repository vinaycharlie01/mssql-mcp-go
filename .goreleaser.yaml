version: 2

project_name: mssql-mcp-go

before:
  hooks:
    - go mod tidy

builds:
  - id: mssql-mcp-go
    main: ./cmd/server
    binary: mssql-mcp-go
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X vinaycharlie01/mssql-mcp-go/mcp-mssql-go/pkg/version.Version={{.Version}}
      - -X vinaycharlie01/mssql-mcp-go/mcp-mssql-go/pkg/version.Commit={{.Commit}}
      - -X vinaycharlie01/mssql-mcp-go/mcp-mssql-go/pkg/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "Merge pull request", "Merge branch"]

homebrew:
  - repository:
      owner: vinaycharlie01
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/vinaycharlie01/mssql-mcp-go"
    description: "Read-only Microsoft SQL Server MCP server for AI assistants"
    license: "MIT"
    install: |
      bin.install "mssql-mcp-go"
    test: |
      assert_match "mcp-mssql-server", shell_output("#{bin}/mssql-mcp-go --help 2>&1", 1)

release:
  github:
    owner: vinaycharlie01
    name: mssql-mcp-go
